[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-arm"
version = "0.1.0"
description = "Astra vision, Jev decisions, and a local SO-101 block-to-glass controller"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "httpx>=0.27,<1", "pydantic>=2.8,<3", "python-dotenv>=1,<2", "opencv-python>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
sim = ["mujoco>=3.3,<4", "numpy>=1.26,<3"]

[project.scripts]
jev-arm = "jev_arm.cli:main"

[tool.setuptools.package-data]
so101_sim = ["assets/**/*", "live_view.html"]

[tool.setuptools.packages.find]
include = ["jev_arm*", "so101_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
